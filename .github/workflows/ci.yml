name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run typecheck

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build & push container
        run: gcloud builds submit --tag gcr.io/smartvolve-factory/onboarding-mvp:${{ github.ref_name }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy onboarding-mvp \
            --image gcr.io/smartvolve-factory/onboarding-mvp:${{ github.ref_name }} \
            --region europe-west8 \
            --platform managed \
            --allow-unauthenticated \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60s

      - name: Route traffic
        run: |
          gcloud run services update-traffic onboarding-mvp \
            --region europe-west8 \
            --to-latest
